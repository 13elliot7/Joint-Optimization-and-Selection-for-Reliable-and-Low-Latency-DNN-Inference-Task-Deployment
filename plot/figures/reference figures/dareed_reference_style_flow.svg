<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900">
  <defs>
    <marker id="arrow-blue-ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="26" markerHeight="26" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7fa9dc"/>
    </marker>
    <marker id="arrow-dark-ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#202020"/>
    </marker>
    <style>
      .serif-title { font-family: serif; font-size: 28px; font-weight: 700; fill: #111; }
      .serif-head { font-family: serif; font-size: 25px; font-weight: 700; fill: #111; }
      .serif-label { font-family: serif; font-size: 22px; fill: #111; }
      .serif-small { font-family: serif; font-size: 18px; fill: #111; }
      .serif-tiny { font-family: serif; font-size: 15px; fill: #111; }
      .panel { fill: #f1f1f1; stroke: none; }
      .flow-box { fill: #d8edf8; stroke: #b4ccd9; stroke-width: 2; filter: url(#soft-shadow); }
      .select-box { fill: #fde8e8; stroke: none; }
      .strategy-card { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.2; filter: url(#soft-shadow); }
      .plane-blue { fill: #d8edf8; opacity: 0.85; }
      .plane-gray { fill: #e8e8e8; opacity: 0.95; }
      .dag-node { fill: #ffffff; stroke: #000000; stroke-width: 1.3; }
      .server-face { fill: #e5dfce; stroke: #746d5c; stroke-width: 1; }
      .server-side { fill: #c9c1ad; stroke: #746d5c; stroke-width: 1; }
      .cloud { fill: #f8fbff; stroke: #4e67a5; stroke-width: 1.2; }
      .thin-line { stroke: #111; stroke-width: 1.2; fill: none; marker-end: url(#arrow-dark-ref); }
      .dash-green { stroke: #2eb67d; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; marker-end: url(#arrow-dark-ref); }
      .dash-orange { stroke: #d85f35; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; marker-end: url(#arrow-dark-ref); }
      .blue-arrow { stroke: #7fa9dc; stroke-width: 18; fill: none; marker-end: url(#arrow-blue-ref); }
      .blue-arrow-small { stroke: #7fa9dc; stroke-width: 14; fill: none; marker-end: url(#arrow-blue-ref); }
    </style>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#888888" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1180" height="900" fill="#ffffff"/>

  <!-- Incoming DNN request -->
  <g id="incoming-dag">
    <polygon points="0,65 330,65 420,0 90,0" class="plane-blue"/>
    <ellipse cx="103" cy="27" rx="19" ry="12" class="dag-node"/>
    <ellipse cx="192" cy="40" rx="19" ry="12" class="dag-node"/>
    <ellipse cx="250" cy="17" rx="19" ry="12" class="dag-node"/>
    <ellipse cx="328" cy="31" rx="19" ry="12" class="dag-node"/>
    <path d="M121 28 L173 37" class="thin-line"/>
    <path d="M121 24 L231 18" class="thin-line"/>
    <path d="M210 38 L309 32" class="thin-line"/>
    <path d="M268 19 L309 28" class="thin-line"/>
    <text x="327" y="116" text-anchor="middle" class="serif-label">Online DNN service request</text>
    <path d="M214 107 L635 107" class="blue-arrow"/>
    <g transform="translate(174,80)">
      <polygon points="0,10 14,18 14,60 0,52" fill="#d9d9d9" stroke="#555"/>
      <polygon points="14,18 27,12 27,54 14,60" fill="#eeeeee" stroke="#555"/>
      <rect x="5" y="17" width="12" height="34" fill="#f7fbff" stroke="#555"/>
      <path d="M-13 22 L5 27" stroke="#333" stroke-width="2"/>
      <path d="M-13 35 L5 39" stroke="#333" stroke-width="2"/>
    </g>
  </g>

  <!-- Algorithm 1 -->
  <g id="algorithm-1">
    <rect x="550" y="0" width="590" height="620" class="panel"/>
    <text x="580" y="39" class="serif-head">Algorithm 1: DAREED Pareto Candidate Search</text>
    <text x="580" y="65" class="serif-head">Based on Customized NSGA-II</text>

    <rect x="670" y="108" width="360" height="80" class="flow-box"/>
    <text x="850" y="139" text-anchor="middle" class="serif-label">Observe dynamic state</text>
    <text x="850" y="166" text-anchor="middle" class="serif-small">load, heat, reliability and bandwidth</text>

    <path d="M850 188 L850 240" class="thin-line"/>
    <rect x="610" y="240" width="480" height="98" class="flow-box"/>
    <text x="850" y="272" text-anchor="middle" class="serif-label">Construct DAG context and initialize population</text>
    <text x="850" y="300" text-anchor="middle" class="serif-small">topological order, critical path, candidate nodes</text>
    <text x="850" y="323" text-anchor="middle" class="serif-small">cloud/local/resource/reliability/topology/random modes</text>

    <path d="M850 338 L850 390" class="thin-line"/>
    <rect x="588" y="390" width="525" height="112" class="flow-box"/>
    <text x="850" y="421" text-anchor="middle" class="serif-label">Iterate through DAG-aware evolutionary operators</text>
    <text x="850" y="449" text-anchor="middle" class="serif-small">role subpopulations, DAG block crossover, skew mutation, repair</text>
    <text x="850" y="474" text-anchor="middle" class="serif-small">dynamic fitness A(t), R(t), U<tspan baseline-shift="sub" font-size="14">T</tspan>, U<tspan baseline-shift="sub" font-size="14">E</tspan>, constraint sorting and crowding</text>

    <path d="M850 502 L850 550" class="thin-line"/>
    <rect x="655" y="550" width="390" height="86" class="flow-box"/>
    <text x="850" y="587" text-anchor="middle" class="serif-label">Obtain feasible Pareto candidate set</text>
    <text x="850" y="615" text-anchor="middle" class="serif-small">non-dominated deployment schemes</text>
  </g>

  <path id="service-request-arrow-top" d="M214 107 L645 107" class="blue-arrow"/>

  <!-- Pareto solution set -->
  <g id="pareto-set">
    <text x="10" y="204" class="serif-title">Pareto candidate solution set</text>

    <g id="strategy-1-card">
      <rect x="8" y="218" width="454" height="210" class="strategy-card"/>
      <polygon points="26,294 389,294 452,235 101,235" class="plane-blue"/>
      <polygon points="30,394 393,394 445,324 119,324" class="plane-gray"/>
      <ellipse cx="127" cy="260" rx="19" ry="12" class="dag-node"/>
      <ellipse cx="218" cy="274" rx="19" ry="12" class="dag-node"/>
      <ellipse cx="280" cy="249" rx="19" ry="12" class="dag-node"/>
      <ellipse cx="358" cy="264" rx="19" ry="12" class="dag-node"/>
      <path d="M145 260 L199 270" class="thin-line"/>
      <path d="M145 257 L261 250" class="thin-line"/>
      <path d="M237 272 L339 264" class="thin-line"/>
      <path d="M299 251 L339 260" class="thin-line"/>
      <g transform="translate(136,330)"><use href="#server-symbol"/></g>
      <g transform="translate(206,342)"><use href="#server-symbol"/></g>
      <g transform="translate(271,326)"><use href="#server-symbol"/></g>
      <g transform="translate(366,329)"><use href="#server-symbol"/></g>
      <g transform="translate(88,382)"><rect x="0" y="0" width="24" height="15" fill="#8ecae6" stroke="#538fa7"/><path d="M10 15 L3 27 L28 27 L17 15" fill="#d4d4d4" stroke="#888"/></g>
      <path d="M127 274 L218 342" class="dash-green"/>
      <path d="M218 286 L284 328" class="dash-green"/>
      <path d="M280 263 L370 330" class="dash-green"/>
      <path d="M358 276 L219 343" class="dash-green"/>
      <path d="M154 348 L216 360" stroke="#222" stroke-width="1"/>
      <path d="M225 352 L277 343" stroke="#222" stroke-width="1"/>
      <path d="M294 338 L368 344" stroke="#222" stroke-width="1"/>
      <path d="M242 364 C253 345 283 341 293 365 C320 365 329 386 310 398 C280 409 246 402 235 389 C214 388 210 367 242 364" class="cloud"/>
      <text x="235" y="419" text-anchor="middle" class="serif-label">strategy 1</text>
    </g>

    <text x="234" y="456" text-anchor="middle" class="serif-label">...</text>

    <g id="strategy-n-card">
      <rect x="8" y="475" width="454" height="210" class="strategy-card"/>
      <polygon points="26,551 389,551 452,492 101,492" class="plane-blue"/>
      <polygon points="30,651 393,651 445,581 119,581" class="plane-gray"/>
      <ellipse cx="127" cy="517" rx="19" ry="12" class="dag-node"/>
      <ellipse cx="218" cy="531" rx="19" ry="12" class="dag-node"/>
      <ellipse cx="280" cy="506" rx="19" ry="12" class="dag-node"/>
      <ellipse cx="358" cy="521" rx="19" ry="12" class="dag-node"/>
      <path d="M145 517 L199 527" class="thin-line"/>
      <path d="M145 514 L261 507" class="thin-line"/>
      <path d="M237 529 L339 521" class="thin-line"/>
      <path d="M299 508 L339 517" class="thin-line"/>
      <g transform="translate(136,587)"><use href="#server-symbol"/></g>
      <g transform="translate(206,599)"><use href="#server-symbol"/></g>
      <g transform="translate(271,583)"><use href="#server-symbol"/></g>
      <g transform="translate(366,586)"><use href="#server-symbol"/></g>
      <g transform="translate(88,639)"><rect x="0" y="0" width="24" height="15" fill="#8ecae6" stroke="#538fa7"/><path d="M10 15 L3 27 L28 27 L17 15" fill="#d4d4d4" stroke="#888"/></g>
      <path d="M127 531 L150 589" class="dash-orange"/>
      <path d="M218 543 L219 600" class="dash-orange"/>
      <path d="M280 520 L287 585" class="dash-orange"/>
      <path d="M358 533 L218 600" class="dash-orange"/>
      <path d="M154 605 L216 617" stroke="#222" stroke-width="1"/>
      <path d="M225 609 L277 600" stroke="#222" stroke-width="1"/>
      <path d="M294 595 L368 601" stroke="#222" stroke-width="1"/>
      <path d="M242 621 C253 602 283 598 293 622 C320 622 329 643 310 655 C280 666 246 659 235 646 C214 645 210 624 242 621" class="cloud"/>
      <text x="235" y="676" text-anchor="middle" class="serif-label">strategy n</text>
    </g>

    <path d="M655 593 L474 593" class="blue-arrow-small"/>
  </g>

  <!-- Bottom selection algorithm -->
  <g id="algorithm-2">
    <path d="M121 685 L121 750" class="blue-arrow-small"/>
    <rect x="0" y="748" width="745" height="135" class="panel"/>

    <rect x="12" y="765" width="188" height="78" class="select-box"/>
    <text x="106" y="790" text-anchor="middle" class="serif-small">Derive task</text>
    <text x="106" y="814" text-anchor="middle" class="serif-small">preference weights</text>
    <text x="106" y="836" text-anchor="middle" class="serif-tiny">accuracy, reliability, delay, energy</text>

    <path d="M200 804 L242 804" class="thin-line"/>
    <rect x="244" y="765" width="210" height="78" class="select-box"/>
    <text x="349" y="790" text-anchor="middle" class="serif-small">Normalize utilities</text>
    <text x="349" y="814" text-anchor="middle" class="serif-small">and calculate score</text>
    <text x="349" y="836" text-anchor="middle" class="serif-tiny">Score = w<tspan baseline-shift="sub" font-size="12">a</tspan>A + w<tspan baseline-shift="sub" font-size="12">r</tspan>R + w<tspan baseline-shift="sub" font-size="12">t</tspan>U<tspan baseline-shift="sub" font-size="12">T</tspan> + w<tspan baseline-shift="sub" font-size="12">e</tspan>U<tspan baseline-shift="sub" font-size="12">E</tspan></text>

    <path d="M454 804 L493 804" class="thin-line"/>
    <rect x="496" y="765" width="210" height="78" class="select-box"/>
    <text x="601" y="790" text-anchor="middle" class="serif-small">Select best feasible</text>
    <text x="601" y="814" text-anchor="middle" class="serif-small">deployment strategy</text>
    <text x="601" y="836" text-anchor="middle" class="serif-tiny">or reject if no deadline-feasible candidate</text>

    <text x="372" y="872" text-anchor="middle" class="serif-head">Algorithm 2: Preference-Based Deployment Selection for DNN Inference</text>
  </g>

  <!-- Final deployment -->
  <g id="final-strategy">
    <path d="M730 804 L810 804" class="blue-arrow-small"/>
    <rect x="806" y="704" width="342" height="174" class="strategy-card"/>
    <polygon points="828,768 1107,768 1140,722 882,722" class="plane-blue"/>
    <polygon points="826,850 1100,850 1138,794 884,794" class="plane-gray"/>
    <ellipse cx="895" cy="745" rx="16" ry="10" class="dag-node"/>
    <ellipse cx="964" cy="758" rx="16" ry="10" class="dag-node"/>
    <ellipse cx="1015" cy="734" rx="16" ry="10" class="dag-node"/>
    <ellipse cx="1074" cy="750" rx="16" ry="10" class="dag-node"/>
    <path d="M910 746 L948 755" class="thin-line"/>
    <path d="M910 742 L1000 735" class="thin-line"/>
    <path d="M980 756 L1058 750" class="thin-line"/>
    <path d="M1030 736 L1059 746" class="thin-line"/>
    <g transform="translate(892,812)"><use href="#server-symbol-small"/></g>
    <g transform="translate(950,829)"><use href="#server-symbol-small"/></g>
    <g transform="translate(1010,810)"><use href="#server-symbol-small"/></g>
    <g transform="translate(1082,818)"><use href="#server-symbol-small"/></g>
    <g transform="translate(852,844)"><rect x="0" y="0" width="21" height="13" fill="#8ecae6" stroke="#538fa7"/><path d="M9 13 L3 24 L25 24 L16 13" fill="#d4d4d4" stroke="#888"/></g>
    <path d="M895 756 L904 813" class="dash-orange"/>
    <path d="M964 768 L960 830" class="dash-orange"/>
    <path d="M1015 744 L1020 811" class="dash-orange"/>
    <path d="M1074 761 L960 830" class="dash-orange"/>
    <path d="M996 835 C1006 819 1030 817 1038 835 C1058 837 1065 853 1051 862 C1028 871 1000 867 991 855 C974 855 972 838 996 835" class="cloud"/>
    <text x="977" y="696" text-anchor="middle" class="serif-label">register running DNN and advance time slot</text>
    <text x="977" y="872" text-anchor="middle" class="serif-label">strategy x</text>
  </g>

  <!-- Reusable server symbols -->
  <defs>
    <g id="server-symbol">
      <polygon points="0,0 24,8 24,45 0,37" class="server-face"/>
      <polygon points="24,8 39,1 39,38 24,45" class="server-side"/>
      <line x1="5" y1="13" x2="15" y2="16" stroke="#746d5c" stroke-width="1"/>
      <circle cx="8" cy="27" r="2" fill="#8a835f"/>
    </g>
    <g id="server-symbol-small">
      <polygon points="0,0 18,6 18,34 0,28" class="server-face"/>
      <polygon points="18,6 30,1 30,29 18,34" class="server-side"/>
      <line x1="4" y1="10" x2="12" y2="13" stroke="#746d5c" stroke-width="1"/>
      <circle cx="6" cy="21" r="1.6" fill="#8a835f"/>
    </g>
  </defs>
</svg>
